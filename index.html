<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>תקציב ביתי חכם | ניהול תקציב ללא עלות</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts: Heebo & Inter for crisp Hebrew & numeric typography -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;500;600;700;800&family=Inter:wght@500;600;700&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Heebo', 'sans-serif'],
                        num: ['Inter', 'Heebo', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <style>
        /* Custom utilities for smooth mobile app feel */
        body {
            font-family: 'Heebo', sans-serif;
            background-color: #f1f5f9;
            -webkit-tap-highlight-color: transparent;
        }
        .num-font {
            font-family: 'Inter', 'Heebo', sans-serif;
            font-variant-numeric: tabular-nums;
        }
        /* Hide scrollbars for horizontal category pills while maintaining scroll */
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
        /* Slide up modal animation */
        @keyframes slideUp {
            from { transform: translateY(100%); opacity: 0.5; }
            to { transform: translateY(0); opacity: 1; }
        }
        .animate-slide-up {
            animation: slideUp 0.25s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }
        /* Toast fade animation */
        @keyframes fadeInOut {
            0% { opacity: 0; transform: translateY(-10px); }
            15% { opacity: 1; transform: translateY(0); }
            85% { opacity: 1; transform: translateY(0); }
            100% { opacity: 0; transform: translateY(-10px); }
        }
        .toast-anim {
            animation: fadeInOut 2.8s ease forwards;
        }
    </style>
</head>
<body class="text-slate-800 antialiased selection:bg-teal-100 selection:text-teal-900">

    <!-- Toast Notification Container (Replaces alert()) -->
    <div id="toast-container" class="fixed top-4 left-1/2 -translate-x-1/2 z-50 w-11/12 max-w-sm pointer-events-none flex flex-col gap-2"></div>

    <!-- Custom Confirmation Modal (Replaces confirm()) -->
    <div id="confirm-modal" class="fixed inset-0 bg-slate-900/50 backdrop-blur-xs z-50 hidden items-center justify-center p-4">
        <div class="bg-white rounded-3xl max-w-sm w-full p-6 shadow-2xl border border-slate-100">
            <h3 id="confirm-title" class="text-lg font-bold text-slate-900 mb-2">אישור פעולה</h3>
            <p id="confirm-message" class="text-sm text-slate-600 mb-6 leading-relaxed"></p>
            <div class="flex gap-3">
                <button id="confirm-yes-btn" class="flex-1 bg-rose-600 hover:bg-rose-700 text-white font-semibold py-2.5 px-4 rounded-xl transition active:scale-95">אישור</button>
                <button id="confirm-cancel-btn" class="flex-1 bg-slate-100 hover:bg-slate-200 text-slate-700 font-semibold py-2.5 px-4 rounded-xl transition active:scale-95">ביטול</button>
            </div>
        </div>
    </div>

    <!-- Main Mobile App Container -->
    <div class="max-w-md mx-auto min-h-screen bg-slate-50 shadow-xl border-x border-slate-200/80 flex flex-col relative pb-24">

        <!-- Top App Header & Month Selector -->
        <header class="bg-white/90 backdrop-blur-md sticky top-0 z-20 border-b border-slate-200/70 px-4 py-3">
            <div class="flex items-center justify-between">
                <div class="flex items-center gap-2">
                    <div class="w-8 h-8 rounded-xl bg-gradient-to-br from-teal-500 to-emerald-600 flex items-center justify-center text-white font-bold shadow-xs">
                        ₪
                    </div>
                    <div>
                        <h1 class="text-base font-bold text-slate-900 leading-tight">תקציב ביתי חכם</h1>
                        <p class="text-[11px] text-slate-500">פרטיות מלאה • שמור במכשיר שלך</p>
                    </div>
                </div>

                <!-- Month Switcher -->
                <div class="flex items-center bg-slate-100 rounded-xl p-1 border border-slate-200/60">
                    <button onclick="changeMonth(-1)" aria-label="חודש קודם" class="p-1.5 rounded-lg hover:bg-white hover:shadow-xs text-slate-600 transition active:scale-90">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M9 5l7 7-7 7"/></svg>
                    </button>
                    <span id="current-month-label" class="text-xs font-bold text-slate-800 px-2.5 min-w-[86px] text-center select-none"></span>
                    <button onclick="changeMonth(1)" aria-label="חודש הבא" class="p-1.5 rounded-lg hover:bg-white hover:shadow-xs text-slate-600 transition active:scale-90">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M15 19l-7-7 7-7"/></svg>
                    </button>
                </div>
            </div>
        </header>

        <!-- Dynamic View Container -->
        <main id="app-content" class="flex-1 p-4 space-y-4">
            <!-- Rendered dynamically via JS -->
        </main>

        <!-- Floating Action Button (FAB) + Bottom Navigation Bar -->
        <nav class="fixed bottom-0 left-1/2 -translate-x-1/2 w-full max-w-md bg-white/95 backdrop-blur-md border-t border-slate-200 px-4 py-2 z-30 flex items-center justify-around shadow-[0_-4px_20px_-5px_rgba(0,0,0,0.06)]">
            <button onclick="switchTab('dashboard')" id="nav-dashboard" class="nav-btn flex flex-col items-center gap-1 py-1 px-3 rounded-xl transition text-teal-600">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"/></svg>
                <span class="text-[11px] font-semibold">דשבורד</span>
            </button>

            <button onclick="switchTab('transactions')" id="nav-transactions" class="nav-btn flex flex-col items-center gap-1 py-1 px-3 rounded-xl transition text-slate-400 hover:text-slate-600">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-3 7h3m-3 4h3m-6-4h.01M9 16h.01"/></svg>
                <span class="text-[11px] font-semibold">תנועות</span>
            </button>

            <!-- Central Quick Add Button ("חוק 3 השניות") -->
            <div class="relative -top-5">
                <button onclick="openQuickAddModal()" aria-label="הוספת הוצאה מהירה" class="w-14 h-14 rounded-2xl bg-gradient-to-tr from-teal-600 to-emerald-500 text-white shadow-lg shadow-teal-500/30 flex items-center justify-center transition transform hover:scale-105 active:scale-95 ring-4 ring-white">
                    <svg class="w-8 h-8" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M12 4v16m8-8H4"/></svg>
                </button>
            </div>

            <button onclick="switchTab('planning')" id="nav-planning" class="nav-btn flex flex-col items-center gap-1 py-1 px-3 rounded-xl transition text-slate-400 hover:text-slate-600">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M12 6V4m0 2a2 2 0 100 4m0-4a2 2 0 110 4m-6 8a2 2 0 100-4m0 4a2 2 0 110-4m0 4v2m0-6V4m6 6v10m6-2a2 2 0 100-4m0 4a2 2 0 110-4m0 4v2m0-6V4"/></svg>
                <span class="text-[11px] font-semibold">תכנון תקציב</span>
            </button>
        </nav>
    </div>

    <!-- Quick Add Expense Modal ("חוק 3 השניות") -->
    <div id="quick-add-modal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-xs z-40 hidden items-end sm:items-center justify-center">
        <div class="bg-white w-full max-w-md rounded-t-3xl sm:rounded-3xl p-5 shadow-2xl animate-slide-up max-h-[92vh] overflow-y-auto">
            <!-- Modal Header -->
            <div class="flex items-center justify-between mb-4">
                <div>
                    <h2 class="text-lg font-bold text-slate-900">הוספת הוצאה מהירה</h2>
                    <p class="text-xs text-slate-500">הזן סכום ובחר קטגוריה בנגיעה</p>
                </div>
                <button onclick="closeQuickAddModal()" class="p-2 rounded-full bg-slate-100 text-slate-500 hover:bg-slate-200 transition">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12"/></svg>
                </button>
            </div>

            <form id="quick-add-form" onsubmit="handleAddExpense(event)" class="space-y-4">
                <!-- Large Numeric Input -->
                <div class="bg-slate-50 border-2 border-teal-500/30 focus-within:border-teal-500 rounded-2xl p-3 text-center transition">
                    <label for="expense-amount" class="block text-xs font-medium text-slate-500 mb-1">סכום ההוצאה (₪)</label>
                    <div class="flex items-center justify-center gap-1">
                        <input type="number" id="expense-amount" step="0.01" min="0.1" required placeholder="0" inputmode="decimal"
                            class="w-40 text-center text-4xl font-extrabold text-slate-900 bg-transparent focus:outline-none num-font placeholder:text-slate-300">
                        <span class="text-2xl font-bold text-slate-400">₪</span>
                    </div>
                </div>

                <!-- 8 Core Categories Grid -->
                <div>
                    <label class="block text-xs font-semibold text-slate-600 mb-2">בחר קטגוריה:</label>
                    <div id="modal-categories-grid" class="grid grid-cols-4 gap-2">
                        <!-- Rendered via JS -->
                    </div>
                </div>

                <!-- Expandable Optional Details (Collapsed by default for 3-second rule) -->
                <div class="border border-slate-200 rounded-2xl overflow-hidden">
                    <button type="button" onclick="toggleExtraOptions()" class="w-full px-4 py-2.5 bg-slate-50/70 hover:bg-slate-100 flex items-center justify-between text-xs font-semibold text-slate-600 transition">
                        <span class="flex items-center gap-1.5">
                            <span>⚙️</span>
                            <span>אפשרויות נוספות (הערה, תאריך, תשלומים)</span>
                        </span>
                        <svg id="extra-options-chevron" class="w-4 h-4 transition-transform duration-200" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M19 9l-7 7-7-7"/></svg>
                    </button>

                    <div id="extra-options-panel" class="hidden p-3.5 bg-white space-y-3 border-t border-slate-100">
                        <div>
                            <label for="expense-note" class="block text-xs font-medium text-slate-600 mb-1">הערה / פירוט (אופציונלי)</label>
                            <input type="text" id="expense-note" placeholder="לדוגמה: קניות לשבת, דלק, קפה..."
                                class="w-full px-3 py-2 text-sm bg-slate-50 border border-slate-200 rounded-xl focus:outline-none focus:border-teal-500">
                        </div>

                        <div class="grid grid-cols-2 gap-3">
                            <div>
                                <label for="expense-date" class="block text-xs font-medium text-slate-600 mb-1">תאריך</label>
                                <input type="date" id="expense-date" required
                                    class="w-full px-3 py-2 text-sm bg-slate-50 border border-slate-200 rounded-xl focus:outline-none focus:border-teal-500 num-font">
                            </div>

                            <div>
                                <label for="expense-installments" class="block text-xs font-medium text-slate-600 mb-1">פריסה לתשלומים</label>
                                <select id="expense-installments" onchange="updateInstallmentPreview()"
                                    class="w-full px-3 py-2 text-sm bg-slate-50 border border-slate-200 rounded-xl focus:outline-none focus:border-teal-500 font-medium">
                                    <option value="1">תשלום 1 (רגיל)</option>
                                    <option value="2">2 תשלומים</option>
                                    <option value="3">3 תשלומים</option>
                                    <option value="4">4 תשלומים</option>
                                    <option value="5">5 תשלומים</option>
                                    <option value="6">6 תשלומים</option>
                                    <option value="8">8 תשלומים</option>
                                    <option value="10">10 תשלומים</option>
                                    <option value="12">12 תשלומים</option>
                                </select>
                            </div>
                        </div>

                        <div id="installment-preview" class="hidden text-xs bg-indigo-50 text-indigo-700 p-2.5 rounded-xl font-medium">
                            <!-- Shows split calculation when installments > 1 -->
                        </div>
                    </div>
                </div>

                <!-- Submit Button -->
                <button type="submit" class="w-full bg-teal-600 hover:bg-teal-700 text-white font-bold py-3.5 px-6 rounded-2xl shadow-lg shadow-teal-600/20 transition transform active:scale-98 text-base">
                    שמור הוצאה
                </button>
            </form>
        </div>
    </div>

    <script>
        /**
         * ============================================================================
         * 1. STATE & CONSTANTS CONFIGURATION
         * ============================================================================
         */
        const STORAGE_KEY = 'smart_home_budget_v1';

        const CORE_CATEGORIES = [
            { id: 'groceries', name: 'מזון וסופר', icon: '🛒', color: 'bg-emerald-500', lightBg: 'bg-emerald-50', text: 'text-emerald-700' },
            { id: 'dining', name: 'אוכל בחוץ וקפה', icon: '☕', color: 'bg-amber-500', lightBg: 'bg-amber-50', text: 'text-amber-700' },
            { id: 'transport', name: 'תחבורה ודלק', icon: '⛽', color: 'bg-blue-500', lightBg: 'bg-blue-50', text: 'text-blue-700' },
            { id: 'kids', name: 'ילדים וחינוך', icon: '🧸', color: 'bg-purple-500', lightBg: 'bg-purple-50', text: 'text-purple-700' },
            { id: 'health', name: 'בריאות ופארם', icon: '💊', color: 'bg-rose-500', lightBg: 'bg-rose-50', text: 'text-rose-700' },
            { id: 'clothing', name: 'ביגוד והנעלה', icon: '👕', color: 'bg-indigo-500', lightBg: 'bg-indigo-50', text: 'text-indigo-700' },
            { id: 'leisure', name: 'פנאי ומתנות', icon: '🎁', color: 'bg-pink-500', lightBg: 'bg-pink-50', text: 'text-pink-700' },
            { id: 'misc', name: 'שונות', icon: '📦', color: 'bg-slate-500', lightBg: 'bg-slate-100', text: 'text-slate-700' }
        ];

        const HEBREW_MONTHS = [
            'ינואר', 'פברואר', 'מרץ', 'אפריל', 'מאי', 'יוני',
            'יולי', 'אוגוסט', 'ספטמבר', 'אוקטובר', 'נובמבר', 'דצמבר'
        ];

        // App Runtime State
        let state = {
            income: 16500,
            fixedItems: [],
            categoryBudgets: {},
            expenses: []
        };

        let currentTab = 'dashboard';
        let selectedMonthKey = getMonthKeyFromDate(new Date()); // Format: "YYYY-MM"
        let selectedCategoryInModal = 'groceries';
        let transactionFilterCategory = 'all';
        let transactionSearchQuery = '';

        /**
         * ============================================================================
         * 2. DATE & FORMATTING HELPERS
         * ============================================================================
         */
        function getMonthKeyFromDate(dateObj) {
            const y = dateObj.getFullYear();
            const m = String(dateObj.getMonth() + 1).padStart(2, '0');
            return `${y}-${m}`;
        }

        function formatMonthHebrew(monthKey) {
            const [y, m] = monthKey.split('-').map(Number);
            return `${HEBREW_MONTHS[m - 1]} ${y}`;
        }

        function addMonthsToKey(monthKey, offset) {
            const [y, m] = monthKey.split('-').map(Number);
            const date = new Date(y, m - 1 + offset, 1);
            return getMonthKeyFromDate(date);
        }

        function formatCurrency(num) {
            return Math.round(num).toLocaleString('he-IL') + ' ₪';
        }

        function formatDateHebrew(dateStr) {
            if (!dateStr) return '';
            const [y, m, d] = dateStr.split('-');
            return `${d}/${m}/${y.slice(2)}`;
        }

        /**
         * Calculates what percentage of the selected month has elapsed.
         * Used for the Pacing Indicator (קצב הוצאה מול התקדמות החודש).
         */
        function getMonthProgressPercent(monthKey) {
            const now = new Date();
            const currentKey = getMonthKeyFromDate(now);
            if (monthKey < currentKey) return 100;
            if (monthKey > currentKey) return 0;

            const [y, m] = monthKey.split('-').map(Number);
            const daysInMonth = new Date(y, m, 0).getDate();
            const today = now.getDate();
            return Math.min(100, Math.max(1, Math.round((today / daysInMonth) * 100)));
        }

        /**
         * ============================================================================
         * 3. INITIALIZATION & LOCAL STORAGE PERSISTENCE
         * ============================================================================
         */
        function createDemoData() {
            const now = new Date();
            const curMonth = getMonthKeyFromDate(now);
            const nextMonth = addMonthsToKey(curMonth, 1);
            const todayStr = now.toISOString().split('T')[0];

            // Helper to generate safe dates within the current month up to today
            const safeDay = (day) => {
                const d = Math.min(day, now.getDate());
                return `${curMonth}-${String(Math.max(1, d)).padStart(2, '0')}`;
            };

            return {
                income: 17000,
                fixedItems: [
                    { id: 'f1', title: 'שכר דירה / משכנתא', amount: 5200 },
                    { id: 'f2', title: 'ארנונה, חשמל ומים', amount: 1150 },
                    { id: 'f3', title: 'מסגרות חינוך וצהרון', amount: 1600 },
                    { id: 'f4', title: 'תקשורת, סלולר וביטוחים', amount: 650 },
                    { id: 'f5', title: 'הפרשה לחיסכון ויעדים', amount: 1500 }
                ],
                categoryBudgets: {
                    groceries: 2600,
                    dining: 800,
                    transport: 1100,
                    kids: 700,
                    health: 400,
                    clothing: 500,
                    leisure: 500,
                    misc: 300
                },
                expenses: [
                    { id: 'e1', monthKey: curMonth, date: safeDay(2), categoryId: 'groceries', amount: 640, note: 'קנייה שבועית גדולה בסופר' },
                    { id: 'e2', monthKey: curMonth, date: safeDay(4), categoryId: 'transport', amount: 260, note: 'תדלוק מלא' },
                    { id: 'e3', monthKey: curMonth, date: safeDay(6), categoryId: 'dining', amount: 85, note: 'קפה ומאפה בבוקר' },
                    { id: 'e4', monthKey: curMonth, date: safeDay(9), categoryId: 'groceries', amount: 520, note: 'ירקות, פירות והשלמות' },
                    { id: 'e5', monthKey: curMonth, date: safeDay(11), categoryId: 'health', amount: 145, note: 'סופר-פארם' },
                    { id: 'e6', monthKey: curMonth, date: safeDay(13), categoryId: 'clothing', amount: 300, note: 'נעליים לילדים (תשלום 1/2)', installmentGroup: 'inst_demo_1' },
                    { id: 'e7', monthKey: nextMonth, date: `${nextMonth}-01`, categoryId: 'clothing', amount: 300, note: 'נעליים לילדים (תשלום 2/2)', installmentGroup: 'inst_demo_1' },
                    { id: 'e8', monthKey: curMonth, date: todayStr, categoryId: 'leisure', amount: 180, note: 'מתנת יום הולדת' }
                ]
            };
        }

        function loadState() {
            try {
                const raw = localStorage.getItem(STORAGE_KEY);
                if (raw) {
                    const parsed = JSON.parse(raw);
                    state = {
                        income: Number(parsed.income) || 0,
                        fixedItems: Array.isArray(parsed.fixedItems) ? parsed.fixedItems : [],
                        categoryBudgets: parsed.categoryBudgets || {},
                        expenses: Array.isArray(parsed.expenses) ? parsed.expenses : []
                    };
                } else {
                    state = createDemoData();
                    saveState();
                }
            } catch (e) {
                console.error('Failed to load state from LocalStorage:', e);
                state = createDemoData();
            }
        }

        function saveState() {
            try {
                localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
            } catch (e) {
                showToast('שגיאה בשמירת הנתונים בדפדפן', 'error');
            }
        }

        /**
         * ============================================================================
         * 4. UI FEEDBACK (TOASTS & CUSTOM CONFIRM MODAL)
         * ============================================================================
         */
        function showToast(message, type = 'success') {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            const bgClass = type === 'error' ? 'bg-rose-600' : (type === 'info' ? 'bg-slate-800' : 'bg-emerald-600');
            toast.className = `${bgClass} text-white text-sm font-medium px-4 py-3 rounded-2xl shadow-lg flex items-center justify-between toast-anim`;
            toast.innerHTML = `<span>${message}</span>`;
            container.appendChild(toast);
            setTimeout(() => toast.remove(), 2900);
        }

        function showConfirm(title, message, onConfirm) {
            const modal = document.getElementById('confirm-modal');
            document.getElementById('confirm-title').textContent = title;
            document.getElementById('confirm-message').textContent = message;
            modal.classList.remove('hidden');
            modal.classList.add('flex');

            const yesBtn = document.getElementById('confirm-yes-btn');
            const cancelBtn = document.getElementById('confirm-cancel-btn');

            const cleanup = () => {
                modal.classList.add('hidden');
                modal.classList.remove('flex');
                yesBtn.onclick = null;
                cancelBtn.onclick = null;
            };

            yesBtn.onclick = () => {
                cleanup();
                onConfirm();
            };
            cancelBtn.onclick = cleanup;
        }

        /**
         * ============================================================================
         * 5. NAVIGATION & MONTH CONTROLS
         * ============================================================================
         */
        function changeMonth(delta) {
            selectedMonthKey = addMonthsToKey(selectedMonthKey, delta);
            updateHeaderMonth();
            renderCurrentTab();
        }

        function updateHeaderMonth() {
            document.getElementById('current-month-label').textContent = formatMonthHebrew(selectedMonthKey);
        }

        function switchTab(tabName) {
            currentTab = tabName;
            document.querySelectorAll('.nav-btn').forEach(btn => {
                btn.classList.remove('text-teal-600');
                btn.classList.add('text-slate-400');
            });
            const activeBtn = document.getElementById(`nav-${tabName}`);
            if (activeBtn) {
                activeBtn.classList.remove('text-slate-400');
                activeBtn.classList.add('text-teal-600');
            }
            renderCurrentTab();
        }

        function renderCurrentTab() {
            const container = document.getElementById('app-content');
            if (currentTab === 'dashboard') {
                renderDashboard(container);
            } else if (currentTab === 'transactions') {
                renderTransactions(container);
            } else if (currentTab === 'planning') {
                renderPlanning(container);
            }
        }

        /**
         * ============================================================================
         * 6. DASHBOARD VIEW ("המבט החטוף")
         * ============================================================================
         */
        function renderDashboard(container) {
            const totalFixed = state.fixedItems.reduce((sum, item) => sum + Number(item.amount || 0), 0);
            const plannedVariable = Object.values(state.categoryBudgets).reduce((sum, val) => sum + Number(val || 0), 0);
            const monthExpenses = state.expenses.filter(e => e.monthKey === selectedMonthKey);
            const actualVariable = monthExpenses.reduce((sum, e) => sum + Number(e.amount || 0), 0);

            const remainingVariable = plannedVariable - actualVariable;
            const spentPercent = plannedVariable > 0 ? Math.round((actualVariable / plannedVariable) * 100) : 0;
            const monthElapsedPercent = getMonthProgressPercent(selectedMonthKey);

            // Pacing logic
            let pacingBadge = { text: 'בקצב מצוין 🟢', bg: 'bg-emerald-500/20 text-emerald-100 border-emerald-400/30' };
            let heroGradient = 'from-slate-900 via-slate-800 to-teal-950';

            if (remainingVariable < 0) {
                pacingBadge = { text: 'חריגה מתקציב 🔴', bg: 'bg-rose-500/30 text-rose-100 border-rose-400/40' };
                heroGradient = 'from-rose-950 via-slate-900 to-slate-900';
            } else if (spentPercent > monthElapsedPercent + 12) {
                pacingBadge = { text: 'קצב מהיר מהמתוכנן ⚠️', bg: 'bg-amber-500/25 text-amber-100 border-amber-400/30' };
            }

            // Build Category Breakdown HTML
            const categoriesHtml = CORE_CATEGORIES.map(cat => {
                const budget = Number(state.categoryBudgets[cat.id] || 0);
                const spent = monthExpenses
                    .filter(e => e.categoryId === cat.id)
                    .reduce((sum, e) => sum + Number(e.amount || 0), 0);
                const left = budget - spent;
                const pct = budget > 0 ? Math.min(100, Math.round((spent / budget) * 100)) : (spent > 0 ? 100 : 0);

                let barColor = 'bg-emerald-500';
                if (left < 0) barColor = 'bg-rose-500';
                else if (pct >= 80) barColor = 'bg-amber-500';

                return `
                    <div onclick="filterTransactionsByCategory('${cat.id}')" class="bg-white p-3.5 rounded-2xl border border-slate-200/70 shadow-2xs hover:border-teal-300 transition cursor-pointer active:scale-[0.99]">
                        <div class="flex items-center justify-between mb-2">
                            <div class="flex items-center gap-2.5">
                                <span class="w-9 h-9 rounded-xl ${cat.lightBg} flex items-center justify-center text-lg">${cat.icon}</span>
                                <div>
                                    <h4 class="text-sm font-bold text-slate-800">${cat.name}</h4>
                                    <p class="text-xs text-slate-500">
                                        ${left >= 0
                                            ? `נותרו <strong class="text-slate-700 num-font">${formatCurrency(left)}</strong> מתוך <span class="num-font">${formatCurrency(budget)}</span>`
                                            : `<span class="text-rose-600 font-semibold">חריגה של <span class="num-font">${formatCurrency(Math.abs(left))}</span></span>`
                                        }
                                    </p>
                                </div>
                            </div>
                            <div class="text-left">
                                <span class="text-sm font-bold text-slate-900 num-font">${formatCurrency(spent)}</span>
                                <span class="block text-[11px] text-slate-400 num-font">${pct}%</span>
                            </div>
                        </div>
                        <div class="w-full h-2 bg-slate-100 rounded-full overflow-hidden">
                            <div class="${barColor} h-full rounded-full transition-all duration-500" style="width: ${pct}%"></div>
                        </div>
                    </div>
                `;
            }).join('');

            container.innerHTML = `
                <!-- Hero Card: Available Variable Budget & Pacing -->
                <section class="bg-gradient-to-br ${heroGradient} text-white rounded-3xl p-5 shadow-lg relative overflow-hidden">
                    <div class="flex items-center justify-between mb-2">
                        <span class="text-xs font-medium text-slate-300">תקציב פנוי להוצאות משתנות</span>
                        <span class="text-[11px] font-semibold px-2.5 py-1 rounded-full border ${pacingBadge.bg}">
                            ${pacingBadge.text}
                        </span>
                    </div>

                    <div class="my-1">
                        <span class="text-4xl font-extrabold tracking-tight num-font ${remainingVariable < 0 ? 'text-rose-300' : 'text-white'}">
                            ${formatCurrency(remainingVariable)}
                        </span>
                    </div>
                    <p class="text-xs text-slate-300 mb-4">
                        נוצלו <span class="font-bold text-white num-font">${formatCurrency(actualVariable)}</span> מתוך <span class="num-font">${formatCurrency(plannedVariable)}</span> שתוכננו
                    </p>

                    <!-- Pacing Visual Comparison Bar -->
                    <div class="bg-white/10 rounded-2xl p-3 backdrop-blur-xs border border-white/10 space-y-2">
                        <div class="flex justify-between text-[11px] font-medium">
                            <span class="text-teal-200">ניצול תקציב: <strong class="num-font">${spentPercent}%</strong></span>
                            <span class="text-slate-300">התקדמות החודש: <strong class="num-font">${monthElapsedPercent}%</strong></span>
                        </div>
                        <div class="relative w-full h-2.5 bg-slate-700/80 rounded-full overflow-visible">
                            <!-- Budget Spent Bar -->
                            <div class="h-full rounded-full transition-all duration-500 ${remainingVariable < 0 ? 'bg-rose-500' : (spentPercent > monthElapsedPercent + 12 ? 'bg-amber-400' : 'bg-emerald-400')}"
                                 style="width: ${Math.min(100, spentPercent)}%"></div>
                            <!-- Month Elapsed Marker Line -->
                            ${monthElapsedPercent > 0 && monthElapsedPercent < 100 ? `
                                <div title="היום בחודש (${monthElapsedPercent}%)" class="absolute -top-1 -bottom-1 w-0.5 bg-white shadow-[0_0_6px_#fff]" style="right: ${monthElapsedPercent}%"></div>
                            ` : ''}
                        </div>
                    </div>
                </section>

                <!-- 3 Summary Mini-Cards -->
                <section class="grid grid-cols-3 gap-2.5">
                    <div class="bg-white p-3 rounded-2xl border border-slate-200/70 shadow-2xs text-center">
                        <span class="block text-[11px] text-slate-500 mb-0.5">הכנסות נטו</span>
                        <span class="text-sm font-bold text-emerald-600 num-font">${formatCurrency(state.income)}</span>
                    </div>
                    <div class="bg-white p-3 rounded-2xl border border-slate-200/70 shadow-2xs text-center">
                        <span class="block text-[11px] text-slate-500 mb-0.5">קבועות וחיסכון</span>
                        <span class="text-sm font-bold text-slate-700 num-font">${formatCurrency(totalFixed)}</span>
                    </div>
                    <div class="bg-white p-3 rounded-2xl border border-slate-200/70 shadow-2xs text-center">
                        <span class="block text-[11px] text-slate-500 mb-0.5">הוצאות משתנות</span>
                        <span class="text-sm font-bold text-teal-600 num-font">${formatCurrency(actualVariable)}</span>
                    </div>
                </section>

                <!-- Category Breakdown List -->
                <section class="space-y-2.5">
                    <div class="flex items-center justify-between px-1">
                        <h3 class="text-sm font-bold text-slate-800">פירוט לפי קטגוריות</h3>
                        <button onclick="switchTab('planning')" class="text-xs font-semibold text-teal-600 hover:underline">ערוך יעדים</button>
                    </div>
                    ${categoriesHtml}
                </section>
            `;
        }

        function filterTransactionsByCategory(catId) {
            transactionFilterCategory = catId;
            switchTab('transactions');
        }

        /**
         * ============================================================================
         * 7. TRANSACTIONS VIEW ("תנועות והיסטוריה")
         * ============================================================================
         */
        function renderTransactions(container) {
            const monthExpenses = state.expenses
                .filter(e => e.monthKey === selectedMonthKey)
                .sort((a, b) => b.date.localeCompare(a.date));

            const filtered = monthExpenses.filter(e => {
                const matchesCat = transactionFilterCategory === 'all' || e.categoryId === transactionFilterCategory;
                const catObj = CORE_CATEGORIES.find(c => c.id === e.categoryId);
                const searchText = `${e.note || ''} ${catObj ? catObj.name : ''}`.toLowerCase();
                const matchesSearch = !transactionSearchQuery || searchText.includes(transactionSearchQuery.toLowerCase());
                return matchesCat && matchesSearch;
            });

            const totalFiltered = filtered.reduce((sum, e) => sum + Number(e.amount || 0), 0);

            const pillsHtml = [
                `<button onclick="setTxFilter('all')" class="px-3 py-1.5 rounded-full text-xs font-semibold whitespace-nowrap transition ${transactionFilterCategory === 'all' ? 'bg-slate-800 text-white' : 'bg-white text-slate-600 border border-slate-200'}">הכל (${monthExpenses.length})</button>`,
                ...CORE_CATEGORIES.map(c => `
                    <button onclick="setTxFilter('${c.id}')" class="px-3 py-1.5 rounded-full text-xs font-semibold whitespace-nowrap transition flex items-center gap-1 ${transactionFilterCategory === c.id ? 'bg-teal-600 text-white' : 'bg-white text-slate-600 border border-slate-200'}">
                        <span>${c.icon}</span>
                        <span>${c.name}</span>
                    </button>
                `)
            ].join('');

            const listHtml = filtered.length === 0 ? `
                <div class="bg-white rounded-3xl p-8 text-center border border-slate-200/70">
                    <div class="text-4xl mb-2">🧾</div>
                    <h4 class="text-sm font-bold text-slate-800 mb-1">אין תנועות להצגה בחודש זה</h4>
                    <p class="text-xs text-slate-500">לחץ על כפתור ה-+ למטה כדי להוסיף הוצאה ב-3 שניות</p>
                </div>
            ` : filtered.map(tx => {
                const cat = CORE_CATEGORIES.find(c => c.id === tx.categoryId) || CORE_CATEGORIES[7];
                const isInstallment = tx.note && tx.note.includes('תשלום ');
                return `
                    <div class="bg-white p-3.5 rounded-2xl border border-slate-200/70 shadow-2xs flex items-center justify-between gap-3">
                        <div class="flex items-center gap-3 min-w-0">
                            <div class="w-10 h-10 rounded-xl ${cat.lightBg} flex items-center justify-center text-lg shrink-0">
                                ${cat.icon}
                            </div>
                            <div class="min-w-0">
                                <div class="flex items-center gap-1.5">
                                    <h4 class="text-sm font-bold text-slate-800 truncate">${tx.note ? escapeHtml(tx.note) : cat.name}</h4>
                                </div>
                                <div class="flex items-center gap-2 text-[11px] text-slate-500 mt-0.5">
                                    <span>${cat.name}</span>
                                    <span>•</span>
                                    <span class="num-font">${formatDateHebrew(tx.date)}</span>
                                    ${isInstallment ? `<span class="bg-indigo-50 text-indigo-700 px-1.5 py-0.5 rounded-md font-semibold">תשלומים</span>` : ''}
                                </div>
                            </div>
                        </div>
                        <div class="flex items-center gap-2 shrink-0">
                            <span class="text-sm font-extrabold text-slate-900 num-font">${formatCurrency(tx.amount)}</span>
                            <button onclick="deleteExpense('${tx.id}')" aria-label="מחק הוצאה" class="p-1.5 text-slate-400 hover:text-rose-600 hover:bg-rose-50 rounded-lg transition">
                                <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/></svg>
                            </button>
                        </div>
                    </div>
                `;
            }).join('');

            container.innerHTML = `
                <section class="space-y-3">
                    <div class="flex items-center justify-between">
                        <h2 class="text-base font-bold text-slate-900">תנועות ב${formatMonthHebrew(selectedMonthKey)}</h2>
                        <span class="text-xs font-bold text-teal-700 bg-teal-50 px-2.5 py-1 rounded-xl num-font">סה"כ: ${formatCurrency(totalFiltered)}</span>
                    </div>

                    <!-- Search Bar -->
                    <div class="relative">
                        <input type="text" value="${escapeHtml(transactionSearchQuery)}" oninput="setTxSearch(this.value)"
                            placeholder="חיפוש לפי הערה או קטגוריה..."
                            class="w-full bg-white border border-slate-200 rounded-2xl py-2.5 pr-9 pl-4 text-sm focus:outline-none focus:border-teal-500">
                        <svg class="w-4 h-4 text-slate-400 absolute right-3 top-3" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/></svg>
                    </div>

                    <!-- Category Filter Pills -->
                    <div class="flex gap-1.5 overflow-x-auto no-scrollbar pb-1">
                        ${pillsHtml}
                    </div>

                    <!-- Expenses List -->
                    <div class="space-y-2">
                        ${listHtml}
                    </div>
                </section>
            `;
        }

        function setTxFilter(catId) {
            transactionFilterCategory = catId;
            renderTransactions(document.getElementById('app-content'));
        }

        function setTxSearch(val) {
            transactionSearchQuery = val;
            renderTransactions(document.getElementById('app-content'));
        }

        function deleteExpense(id) {
            showConfirm('מחיקת הוצאה', 'האם למחוק הוצאה זו מהרשימה?', () => {
                state.expenses = state.expenses.filter(e => e.id !== id);
                saveState();
                renderCurrentTab();
                showToast('ההוצאה נמחקה', 'info');
            });
        }

        /**
         * ============================================================================
         * 8. MONTHLY PLANNING & ZERO-BASED BUDGETING ("תכנון תקציב וגיבוי")
         * ============================================================================
         */
        function renderPlanning(container) {
            const totalFixed = state.fixedItems.reduce((sum, item) => sum + Number(item.amount || 0), 0);
            const availableForVariable = state.income - totalFixed;
            const allocatedVariable = Object.values(state.categoryBudgets).reduce((sum, val) => sum + Number(val || 0), 0);
            const unallocated = availableForVariable - allocatedVariable;

            const fixedListHtml = state.fixedItems.map(item => `
                <div class="flex items-center justify-between py-2 border-b border-slate-100 last:border-0">
                    <span class="text-sm text-slate-700 font-medium">${escapeHtml(item.title)}</span>
                    <div class="flex items-center gap-2">
                        <span class="text-sm font-bold text-slate-900 num-font">${formatCurrency(item.amount)}</span>
                        <button onclick="removeFixedItem('${item.id}')" class="text-slate-400 hover:text-rose-600 p-1">
                            <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12"/></svg>
                        </button>
                    </div>
                </div>
            `).join('');

            const variableInputsHtml = CORE_CATEGORIES.map(cat => {
                const val = Number(state.categoryBudgets[cat.id] || 0);
                return `
                    <div class="flex items-center justify-between gap-3 py-2 border-b border-slate-100 last:border-0">
                        <div class="flex items-center gap-2">
                            <span class="w-8 h-8 rounded-lg ${cat.lightBg} flex items-center justify-center text-base">${cat.icon}</span>
                            <span class="text-sm font-semibold text-slate-800">${cat.name}</span>
                        </div>
                        <div class="flex items-center gap-1 bg-slate-50 border border-slate-200 rounded-xl px-2.5 py-1.5 focus-within:border-teal-500">
                            <input type="number" min="0" step="50" value="${val}"
                                onchange="updateCategoryBudget('${cat.id}', this.value)"
                                class="w-20 text-left font-bold text-sm text-slate-900 bg-transparent focus:outline-none num-font">
                            <span class="text-xs text-slate-400 font-bold">₪</span>
                        </div>
                    </div>
                `;
            }).join('');

            container.innerHTML = `
                <!-- Step 1: Net Income -->
                <section class="bg-white p-4 rounded-3xl border border-slate-200/80 shadow-2xs space-y-2">
                    <div class="flex items-center justify-between">
                        <span class="text-xs font-bold text-teal-600 uppercase">שלב 1 • הכנסות</span>
                        <span class="text-xs text-slate-400">נטו בחשבון</span>
                    </div>
                    <div class="flex items-center justify-between">
                        <label for="income-input" class="text-sm font-bold text-slate-800">סך הכנסות חודשיות:</label>
                        <div class="flex items-center gap-1 bg-emerald-50/70 border border-emerald-200 rounded-xl px-3 py-1.5">
                            <input type="number" id="income-input" min="0" step="100" value="${state.income}"
                                onchange="updateIncome(this.value)"
                                class="w-24 text-left font-extrabold text-base text-emerald-700 bg-transparent focus:outline-none num-font">
                            <span class="text-sm font-bold text-emerald-600">₪</span>
                        </div>
                    </div>
                </section>

                <!-- Step 2: Fixed Expenses & Savings ("הבטון") -->
                <section class="bg-white p-4 rounded-3xl border border-slate-200/80 shadow-2xs space-y-3">
                    <div class="flex items-center justify-between">
                        <span class="text-xs font-bold text-teal-600">שלב 2 • הוצאות קבועות וחיסכון</span>
                        <span class="text-xs font-bold text-slate-700 num-font">סה"כ: ${formatCurrency(totalFixed)}</span>
                    </div>

                    <div class="divide-y divide-slate-100">
                        ${fixedListHtml || '<p class="text-xs text-slate-400 py-2">לא הוגדרו הוצאות קבועות</p>'}
                    </div>

                    <!-- Add New Fixed Item Form -->
                    <form onsubmit="handleAddFixedItem(event)" class="flex gap-2 pt-1">
                        <input type="text" id="new-fixed-title" required placeholder="שם ההוצאה / חיסכון..."
                            class="flex-1 text-xs bg-slate-50 border border-slate-200 rounded-xl px-3 py-2 focus:outline-none focus:border-teal-500">
                        <input type="number" id="new-fixed-amount" required min="1" placeholder="סכום"
                            class="w-20 text-xs bg-slate-50 border border-slate-200 rounded-xl px-2.5 py-2 focus:outline-none focus:border-teal-500 num-font">
                        <button type="submit" class="bg-slate-800 hover:bg-slate-900 text-white text-xs font-bold px-3 py-2 rounded-xl transition">+</button>
                    </form>
                </section>

                <!-- Step 3: Zero-Based Variable Budget Allocation -->
                <section class="bg-white p-4 rounded-3xl border border-slate-200/80 shadow-2xs space-y-3">
                    <div class="flex items-center justify-between">
                        <span class="text-xs font-bold text-teal-600">שלב 3 • חלוקת תקציב משתנות</span>
                        <span class="text-xs text-slate-500">פנוי לחלוקה: <strong class="num-font">${formatCurrency(availableForVariable)}</strong></span>
                    </div>

                    <!-- Zero-Based Balance Banner -->
                    <div class="p-3 rounded-2xl flex items-center justify-between text-xs font-bold ${unallocated === 0 ? 'bg-emerald-50 text-emerald-800 border border-emerald-200' : (unallocated > 0 ? 'bg-amber-50 text-amber-800 border border-amber-200' : 'bg-rose-50 text-rose-800 border border-rose-200')}">
                        <span>
                            ${unallocated === 0 ? '🎯 מעולה! כל התקציב מחולק במדויק (אפס יתרה)' : (unallocated > 0 ? '💡 נותר סכום פנוי לחלוקה לקטגוריות:' : '⚠️ חרגת מהתקציב הפנוי ב-')}
                        </span>
                        <span class="text-sm num-font">${unallocated !== 0 ? formatCurrency(Math.abs(unallocated)) : '0 ₪'}</span>
                    </div>

                    <div>
                        ${variableInputsHtml}
                    </div>
                </section>

                <!-- Data Ownership, Export & Reset Section -->
                <section class="bg-slate-100 p-4 rounded-3xl border border-slate-200 space-y-3">
                    <div>
                        <h3 class="text-xs font-bold text-slate-800">גיבוי ובעלות מלאה על הנתונים (0 ₪)</h3>
                        <p class="text-[11px] text-slate-500 mt-0.5">הנתונים שלך נשמרים מקומית בדפדפן בלבד. תוכל לייצא אותם בכל עת.</p>
                    </div>

                    <div class="grid grid-cols-2 gap-2">
                        <button onclick="exportCSV()" class="bg-white hover:bg-slate-50 text-slate-800 border border-slate-200 text-xs font-bold py-2.5 px-3 rounded-xl flex items-center justify-center gap-1.5 shadow-2xs transition">
                            <span>📊</span>
                            <span>ייצוא לאקסל (CSV)</span>
                        </button>
                        <button onclick="exportJSON()" class="bg-white hover:bg-slate-50 text-slate-800 border border-slate-200 text-xs font-bold py-2.5 px-3 rounded-xl flex items-center justify-center gap-1.5 shadow-2xs transition">
                            <span>💾</span>
                            <span>שמור גיבוי (JSON)</span>
                        </button>
                    </div>

                    <div class="grid grid-cols-2 gap-2">
                        <label class="bg-white hover:bg-slate-50 text-slate-700 border border-slate-200 text-xs font-semibold py-2 px-3 rounded-xl flex items-center justify-center gap-1.5 cursor-pointer transition">
                            <span>📂</span>
                            <span>שחזור מגיבוי</span>
                            <input type="file" accept=".json" onchange="importJSON(event)" class="hidden">
                        </label>
                        <button onclick="resetToDemo()" class="bg-rose-50 hover:bg-rose-100 text-rose-700 border border-rose-200 text-xs font-semibold py-2 px-3 rounded-xl transition">
                            איפוס / נתוני דוגמה
                        </button>
                    </div>
                </section>
            `;
        }

        function updateIncome(val) {
            state.income = Math.max(0, Number(val) || 0);
            saveState();
            renderPlanning(document.getElementById('app-content'));
            showToast('הכנסה חודשית עודכנה');
        }

        function handleAddFixedItem(e) {
            e.preventDefault();
            const titleEl = document.getElementById('new-fixed-title');
            const amountEl = document.getElementById('new-fixed-amount');
            const title = titleEl.value.trim();
            const amount = Number(amountEl.value);

            if (!title || amount <= 0) return;

            state.fixedItems.push({
                id: 'f_' + Date.now(),
                title,
                amount
            });
            saveState();
            renderPlanning(document.getElementById('app-content'));
            showToast('סעיף קבוע נוסף');
        }

        function removeFixedItem(id) {
            state.fixedItems = state.fixedItems.filter(item => item.id !== id);
            saveState();
            renderPlanning(document.getElementById('app-content'));
            showToast('סעיף קבוע הוסר', 'info');
        }

        function updateCategoryBudget(catId, val) {
            state.categoryBudgets[catId] = Math.max(0, Number(val) || 0);
            saveState();
            renderPlanning(document.getElementById('app-content'));
        }

        /**
         * ============================================================================
         * 9. QUICK ADD EXPENSE MODAL & INSTALLMENTS LOGIC ("חוק 3 השניות")
         * ============================================================================
         */
        function openQuickAddModal() {
            const modal = document.getElementById('quick-add-modal');
            modal.classList.remove('hidden');
            modal.classList.add('flex');

            // Reset form fields
            const amountInput = document.getElementById('expense-amount');
            amountInput.value = '';
            document.getElementById('expense-note').value = '';
            document.getElementById('expense-installments').value = '1';
            document.getElementById('installment-preview').classList.add('hidden');

            // Default date: today if viewing current month, else 1st of selected month
            const today = new Date();
            const currentKey = getMonthKeyFromDate(today);
            document.getElementById('expense-date').value = (selectedMonthKey === currentKey)
                ? today.toISOString().split('T')[0]
                : `${selectedMonthKey}-01`;

            renderModalCategories();

            // Auto-focus numeric input for instant typing
            setTimeout(() => amountInput.focus(), 80);
        }

        function closeQuickAddModal() {
            const modal = document.getElementById('quick-add-modal');
            modal.classList.add('hidden');
            modal.classList.remove('flex');
        }

        function renderModalCategories() {
            const grid = document.getElementById('modal-categories-grid');
            grid.innerHTML = CORE_CATEGORIES.map(cat => {
                const isSelected = selectedCategoryInModal === cat.id;
                return `
                    <button type="button" onclick="selectModalCategory('${cat.id}')"
                        class="flex flex-col items-center justify-center p-2.5 rounded-2xl border-2 transition active:scale-95 ${isSelected ? 'border-teal-600 bg-teal-50/70 shadow-xs' : 'border-slate-100 bg-slate-50/60 hover:bg-slate-100'}">
                        <span class="text-2xl mb-1">${cat.icon}</span>
                        <span class="text-[11px] font-bold text-slate-800 text-center leading-tight">${cat.name}</span>
                    </button>
                `;
            }).join('');
        }

        function selectModalCategory(catId) {
            selectedCategoryInModal = catId;
            renderModalCategories();
        }

        function toggleExtraOptions() {
            const panel = document.getElementById('extra-options-panel');
            const chevron = document.getElementById('extra-options-chevron');
            panel.classList.toggle('hidden');
            chevron.classList.toggle('rotate-180');
        }

        function updateInstallmentPreview() {
            const amount = Number(document.getElementById('expense-amount').value || 0);
            const count = Number(document.getElementById('expense-installments').value || 1);
            const preview = document.getElementById('installment-preview');

            if (count > 1 && amount > 0) {
                const perMonth = (amount / count).toFixed(2).replace(/\.00$/, '');
                preview.textContent = `הסכום יחולק אוטומטית ל-${count} תשלומים של ${perMonth} ₪ בחודש הקרוב ובחודשים הבאים.`;
                preview.classList.remove('hidden');
            } else {
                preview.classList.add('hidden');
            }
        }

        // Listen for amount typing to update installment preview dynamically
        document.getElementById('expense-amount').addEventListener('input', updateInstallmentPreview);

        function handleAddExpense(e) {
            e.preventDefault();
            const totalAmount = Number(document.getElementById('expense-amount').value);
            if (!totalAmount || totalAmount <= 0) {
                showToast('נא להזין סכום תקין', 'error');
                return;
            }

            const baseNote = document.getElementById('expense-note').value.trim();
            const dateStr = document.getElementById('expense-date').value || new Date().toISOString().split('T')[0];
            const installments = Number(document.getElementById('expense-installments').value || 1);
            const startMonthKey = dateStr.slice(0, 7);

            if (installments === 1) {
                state.expenses.push({
                    id: 'tx_' + Date.now(),
                    monthKey: startMonthKey,
                    date: dateStr,
                    categoryId: selectedCategoryInModal,
                    amount: totalAmount,
                    note: baseNote
                });
            } else {
                // Split equally across consecutive months
                const baseSplit = Math.floor((totalAmount / installments) * 100) / 100;
                const remainder = Number((totalAmount - baseSplit * installments).toFixed(2));
                const groupId = 'inst_' + Date.now();

                for (let i = 0; i < installments; i++) {
                    const targetMonth = addMonthsToKey(startMonthKey, i);
                    const splitAmount = i === 0 ? Number((baseSplit + remainder).toFixed(2)) : baseSplit;
                    const installmentLabel = `(תשלום ${i + 1}/${installments})`;
                    const fullNote = baseNote ? `${baseNote} ${installmentLabel}` : installmentLabel;

                    state.expenses.push({
                        id: `tx_${Date.now()}_${i}`,
                        monthKey: targetMonth,
                        date: i === 0 ? dateStr : `${targetMonth}-01`,
                        categoryId: selectedCategoryInModal,
                        amount: splitAmount,
                        note: fullNote,
                        installmentGroup: groupId
                    });
                }
            }

            saveState();
            closeQuickAddModal();
            renderCurrentTab();

            const msg = installments > 1
                ? `נשמרה הוצאה ב-${installments} תשלומים!`
                : `נוספה הוצאה של ${formatCurrency(totalAmount)}!`;
            showToast(msg);
        }

        /**
         * ============================================================================
         * 10. DATA EXPORT, BACKUP & RESET (ZERO-COST OWNERSHIP)
         * ============================================================================
         */
        function exportCSV() {
            // Add UTF-8 BOM (\uFEFF) so Excel opens Hebrew characters properly
            let csv = '\uFEFFתאריך,חודש תקציב,קטגוריה,סכום,הערה\n';
            state.expenses.forEach(e => {
                const cat = CORE_CATEGORIES.find(c => c.id === e.categoryId);
                const catName = cat ? cat.name : e.categoryId;
                const safeNote = (e.note || '').replace(/"/g, '""');
                csv += `${e.date},${e.monthKey},"${catName}",${e.amount},"${safeNote}"\n`;
            });

            downloadFile(csv, `budget_export_${selectedMonthKey}.csv`, 'text/csv;charset=utf-8;');
            showToast('קובץ אקסל (CSV) ירד למכשיר');
        }

        function exportJSON() {
            const jsonStr = JSON.stringify(state, null, 2);
            downloadFile(jsonStr, `smart_budget_backup_${new Date().toISOString().slice(0,10)}.json`, 'application/json');
            showToast('קובץ גיבוי נשמר בהצלחה');
        }

        function importJSON(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = (e) => {
                try {
                    const imported = JSON.parse(e.target.result);
                    if (typeof imported.income === 'number' && Array.isArray(imported.expenses)) {
                        state = imported;
                        saveState();
                        renderCurrentTab();
                        showToast('הנתונים שוחזרו בהצלחה!');
                    } else {
                        showToast('קובץ גיבוי לא תקין', 'error');
                    }
                } catch (err) {
                    showToast('שגיאה בקריאת הקובץ', 'error');
                }
            };
            reader.readAsText(file);
        }

        function resetToDemo() {
            showConfirm(
                'איפוס נתונים',
                'פעולה זו תחזיר את נתוני הדוגמה ההתחלתיים ותמחק שינויים שביצעת. להמשיך?',
                () => {
                    state = createDemoData();
                    saveState();
                    renderCurrentTab();
                    showToast('נתוני הדוגמה נטענו מחדש', 'info');
                }
            );
        }

        function downloadFile(content, filename, mimeType) {
            const blob = new Blob([content], { type: mimeType });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = filename;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
        }

        function escapeHtml(str) {
            if (!str) return '';
            return String(str)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#039;');
        }

        /**
         * ============================================================================
         * 11. BOOTSTRAP APPLICATION ON WINDOW LOAD
         * ============================================================================
         */
        window.onload = function() {
            loadState();
            updateHeaderMonth();
            renderCurrentTab();
        };
    </script>
</body>
